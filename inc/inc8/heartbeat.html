<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartbeat Tracker</title>

    <style>
        #stage {
            width: 600px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            overflow: hidden;

            /* Makes the grid */
            background-image:
                linear-gradient(to right, #ccc 1px, transparent 1px),
                linear-gradient(to bottom, #ccc 1px, transparent 1px);

            background-size: 40px 40px;
        }

        #heart {
            position: absolute;
            font-size: 40px;
            left: 0;
            top: 0;
        }
    </style>
</head>

<body>

    <h1>Move the Heart</h1>

    <div id="stage">
        <div id="heart">❤️</div>
    </div>

    <br>

    <label for="speed">Speed:</label>
    <input type="range" id="speed" min="1" max="20" value="5">

    <button id="reset">Reset</button>

    <script>
        // Gets the elements from the page
        const stage = document.getElementById("stage");
        const heart = document.getElementById("heart");
        const speedInput = document.getElementById("speed");
        const resetButton = document.getElementById("reset");

        // Stores the heart information
        const heartState = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            speed: 5,
            moving: false
        };

        // Keeps a number between the minimum and maximum
        function clamp(value, min, max) {
            return Math.max(min, Math.min(value, max));
        }

        // Updates the heart position
        function updateHeart() {
            heart.style.transform =
                `translate(${heartState.x}px, ${heartState.y}px)`;
        }

        // Runs when the stage is clicked
        stage.addEventListener("click", function(event) {

            // Gets the stage position
            const box = stage.getBoundingClientRect();

            // Gets the clicked position
            const clickX = event.clientX - box.left;
            const clickY = event.clientY - box.top;

            // Keeps the target inside the stage
            heartState.targetX = clamp(
                clickX,
                0,
                stage.clientWidth - heart.offsetWidth
            );

            heartState.targetY = clamp(
                clickY,
                0,
                stage.clientHeight - heart.offsetHeight
            );

            // Starts the animation
            if (!heartState.moving) {
                heartState.moving = true;
                requestAnimationFrame(animateHeart);
            }
        });

        // Moves the heart toward the target
        function animateHeart() {

            // Finds the distance to the target
            const xDistance = heartState.targetX - heartState.x;
            const yDistance = heartState.targetY - heartState.y;

            const distance = Math.sqrt(
                xDistance ** 2 + yDistance ** 2
            );

            // Stops when the heart reaches the target
            if (distance <= heartState.speed) {
                heartState.x = heartState.targetX;
                heartState.y = heartState.targetY;
                heartState.moving = false;
            } else {

                // Moves the heart one step closer
                heartState.x +=
                    (xDistance / distance) * heartState.speed;

                heartState.y +=
                    (yDistance / distance) * heartState.speed;
            }

            // Shows the new position
            updateHeart();

            // Keeps the animation going
            if (heartState.moving) {
                requestAnimationFrame(animateHeart);
            }
        }

        // Changes the speed
        speedInput.addEventListener("input", function() {
            heartState.speed = Number(speedInput.value);
        });

        // Resets Button
        resetButton.addEventListener("click", function() {
            heartState.x = 0;
            heartState.y = 0;
            heartState.targetX = 0;
            heartState.targetY = 0;
            heartState.speed = 5;
            heartState.moving = false;

            speedInput.value = 5;

            updateHeart();
        });
    </script>

</body>
</html>
